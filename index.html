<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Romy's Exercise Quest</title>

<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png">

<meta property="og:title" content="Romy's Exercise Quest">
<meta property="og:description" content="3 workouts a week. Track your streak.">
<meta property="og:image" content="https://romyexercisequest.vercel.app/og-image.png">
<meta property="og:type" content="website">
<meta property="og:url" content="https://romyexercisequest.vercel.app">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Romy's Exercise Quest">
<meta name="twitter:description" content="3 workouts a week. Track your streak.">
<meta name="twitter:image" content="https://romyexercisequest.vercel.app/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #FFF8EF;
    --cream-2: #FFF1DC;
    --pink: #FF8FAE;
    --pink-dark: #E5678F;
    --yellow: #FFC94D;
    --yellow-dark: #E0A415;
    --mint: #6FD9A0;
    --mint-dark: #379764;
    --sky: #6FC3E8;
    --sky-dark: #2E8FBD;
    --ink: #4A3350;
    --ink-soft: #8A7A91;
    --card-border: #EAD9C4;
    --shadow: rgba(74, 51, 80, 0.14);
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--cream);
    background-image:
      radial-gradient(circle at 8% 12%, #FFE3EE 0%, transparent 40%),
      radial-gradient(circle at 92% 8%, #DFF6FF 0%, transparent 38%),
      radial-gradient(circle at 85% 90%, #FFF3D2 0%, transparent 40%);
    font-family: 'Nunito', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    padding: 32px 16px 80px;
  }
  .wrap{ max-width: 760px; margin: 0 auto; }
  h1, .display{ font-family: 'Baloo 2', cursive; }

  .header{
    display:flex;
    align-items:center;
    gap: 20px;
    background: #fff;
    border: 3px solid var(--card-border);
    border-radius: 28px;
    padding: 18px 24px;
    box-shadow: 0 6px 0 var(--shadow);
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
#mascot-slot{ width: 100px; height: 92px; flex-shrink:0; position:relative; display:flex; align-items:center; justify-content:center; overflow:visible; }
  #mascot-slot .mascot-img{ width:92px; height:92px; object-fit:contain; border-radius:22px; mix-blend-mode:multiply; transform-origin:50% 82%; }
  #mascot-slot .mascot-burst{ position:absolute; inset:-8px; pointer-events:none; opacity:0; }
  #mascot-slot .mascot-burst span{ position:absolute; font-size:15px; animation: mascotSpark 1.25s ease-in-out infinite; }
  #mascot-slot .mascot-burst span:nth-child(1){left:0;top:4px;animation-delay:0s}
  #mascot-slot .mascot-burst span:nth-child(2){right:0;top:0;animation-delay:.25s}
  #mascot-slot .mascot-burst span:nth-child(3){right:-3px;bottom:5px;animation-delay:.5s}
  #mascot-slot .mascot-burst span:nth-child(4){left:3px;bottom:1px;animation-delay:.75s}
  @keyframes mascotSpark{0%,100%{transform:scale(.55) rotate(0);opacity:.2}50%{transform:scale(1.15) rotate(18deg);opacity:1}}
  #mascot-slot.mood-calm .mascot-img{ animation: mascotBounceCalm 3.2s ease-in-out infinite; }
  #mascot-slot.mood-content .mascot-img{ animation: mascotBounceContent 2.4s ease-in-out infinite; }
  #mascot-slot.mood-happy .mascot-img{ animation: mascotBounceHappy 1.5s ease-in-out infinite; }
  #mascot-slot.mood-content .mascot-burst{opacity:.3}
  #mascot-slot.mood-happy .mascot-burst{opacity:.65}
  #mascot-slot.mood-ecstatic .mascot-img{ animation: mascotBounceEcstatic .72s ease-in-out infinite; }
  #mascot-slot.mood-ecstatic .mascot-burst{opacity:1}
  .header-text{ flex: 1; min-width: 180px; }
  .title{ font-size: 26px; font-weight: 800; margin: 0 0 2px; color: var(--ink); }
  .subtitle{ font-size: 14px; color: var(--ink-soft); margin:0; font-weight: 700; }

  .progress-card{
    background:#fff;
    border: 3px solid var(--card-border);
    border-radius: 24px;
    padding: 18px 22px;
    margin-bottom: 26px;
    box-shadow: 0 6px 0 var(--shadow);
  }
  .progress-title{ font-weight: 800; font-size: 15px; margin-bottom: 10px; display:flex; justify-content:space-between; align-items:center;}
  .progress-title span.small{ font-size:12px; color: var(--ink-soft); font-weight:700; }
  .dots{ display:flex; gap: 10px; }
  .dot{
    flex:1;
    height: 26px;
    border-radius: 13px;
    background: var(--cream-2);
    border: 2px solid var(--card-border);
    position: relative;
    overflow: hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Baloo 2',cursive;
    font-weight: 800;
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.55;
  }
  .dot.filled{ background: var(--yellow); border-color: var(--yellow-dark); color: #7A5300; opacity: 1; }
  .dot.current{ box-shadow: inset 0 0 0 2px var(--pink); }

  .weeks{ display:flex; flex-direction:column; gap: 16px; }

  .week-card{
    background:#fff;
    border: 3px solid var(--card-border);
    border-radius: 24px;
    padding: 16px 18px;
    box-shadow: 0 5px 0 var(--shadow);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.2s ease, background 0.2s ease;
  }
  .week-card.done{
    border-color: var(--mint-dark);
    background: #EEFBF3;
  }
  .week-card.celebrate{ animation: pop 0.5s ease; }
  @keyframes pop{
    0%{ transform: scale(1); }
    35%{ transform: scale(1.035); }
    100%{ transform: scale(1); }
  }

  .week-top{
    display:flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .week-label{ font-family:'Baloo 2',cursive; font-weight: 700; font-size: 16px; }
  .week-badge{
    font-size: 11px;
    font-weight: 800;
    padding: 4px 12px;
    border-radius: 14px;
    background: var(--cream-2);
    color: var(--ink-soft);
  }
  .week-card.done .week-badge{ background: var(--mint); color: #0F5C36; }

  .days{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 8px;
  }
  .day{
    display:flex;
    flex-direction: column;
    align-items:center;
    gap:5px;
  }
  .day-name{ font-size: 10px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; }
  .day-num{ font-size: 10px; font-weight: 700; color: var(--ink-soft); }
  .day-btn{
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 2.5px solid var(--card-border);
    background: var(--cream-2);
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 0;
    transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease;
  }
  .day-btn:hover{ transform: translateY(-2px); }
  .day-btn:active{ transform: scale(0.92); }
  .day-btn svg{ width: 20px; height: 20px; }
  .day-btn.logged{
    background: var(--mint);
    border-color: var(--mint-dark);
  }
  .day-btn.future{ opacity: 0.45; cursor: default; }
  .day-btn.future:hover{ transform:none; }

  .past-label{
    font-family:'Baloo 2',cursive;
    font-weight:700;
    font-size:15px;
    color: var(--ink-soft);
    text-align:center;
    margin: 12px 0 -4px;
  }
  .surprise-overlay{
    position:fixed; inset:0;
    background: rgba(74,51,80,0.55);
    display:none;
    align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .surprise-overlay.show{ display:flex; animation: surpriseFade 0.3s ease; }
  @keyframes surpriseFade{ from{ opacity:0; } to{ opacity:1; } }
  .surprise-card{
    background:#fff;
    border:3px solid var(--card-border);
    border-radius:32px;
    box-shadow:0 8px 0 var(--shadow);
    max-width:380px; width:100%;
    padding:30px 24px 26px;
    text-align:center;
    position:relative;
  }
  .surprise-close{
    position:absolute; top:12px; right:14px;
    background:none; border:0; font-size:22px; line-height:1;
    color: var(--ink-soft); cursor:pointer;
  }
  .surprise-title{ font-family:'Baloo 2',cursive; font-size:30px; font-weight:800; margin:0 0 4px; color: var(--ink); }
  .surprise-sub{ font-weight:700; color: var(--ink-soft); margin:0 0 14px; font-size:15px; }
  .gift-btn{
    background:none; border:0; padding:0; cursor:pointer;
    animation: giftWiggle 1.1s ease-in-out infinite;
    transform-origin: 50% 90%;
  }
  .gift-btn svg{ width:160px; height:160px; overflow:visible; }
  @keyframes giftWiggle{
    0%,100%{ transform: rotate(0deg) scale(1); }
    20%{ transform: rotate(-6deg) scale(1.04); }
    40%{ transform: rotate(6deg) scale(1.04); }
    60%{ transform: rotate(-4deg) scale(1.02); }
    80%{ transform: rotate(3deg) scale(1.02); }
  }
  .gift-lid{ transition: transform 0.65s cubic-bezier(.34,1.56,.64,1), opacity 0.65s ease; transform-origin: 50% 100%; }
  .surprise-card.opening .gift-btn{ animation:none; }
  .surprise-card.opening .gift-lid{ transform: translate(14px,-80px) rotate(-24deg); opacity:0; }
  .gift-hint{ font-weight:800; font-size:13px; color: var(--pink-dark); text-transform:uppercase; letter-spacing:0.05em; margin-top:6px; }
  .prize-reveal{ display:none; }
  .surprise-card.opened .gift-stage{ display:none; }
  .surprise-card.opened .prize-reveal{ display:block; animation: revealPop 0.7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes revealPop{ from{ opacity:0; transform: scale(0.6); } to{ opacity:1; transform: scale(1); } }
  .prize-reveal img{ width:170px; height:170px; object-fit:contain; border-radius:24px; animation: prizeBob 1s ease-in-out infinite; }
  @keyframes prizeBob{ 0%,100%{ transform: translateY(0) rotate(-2deg); } 50%{ transform: translateY(-8px) rotate(2deg); } }
  .prize-note{ font-family:'Baloo 2',cursive; font-weight:700; font-size:19px; color: var(--ink); margin:10px 0 16px; line-height:1.3; }
  .surprise-done{
    font-family:'Baloo 2',cursive; font-weight:800; font-size:17px;
    background: var(--mint); color:#0F5C36;
    border:3px solid var(--mint-dark); border-radius:20px;
    padding:10px 30px; cursor:pointer; box-shadow:0 4px 0 var(--shadow);
  }
  .surprise-done:active{ transform: translateY(2px); box-shadow:0 2px 0 var(--shadow); }

  .load-more{
    display:block;
    margin: 22px auto 0;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    font-size: 15px;
    color: var(--ink);
    background: #fff;
    border: 3px solid var(--card-border);
    border-radius: 20px;
    padding: 10px 26px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--shadow);
  }
  .load-more:hover{ background: var(--cream-2); }
  .load-more:active{ transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }

  .confetti{
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 2px;
    top: -10px;
    pointer-events: none;
  }

  .toast{
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: #fff;
    font-family: 'Baloo 2', cursive;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 18px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    opacity: 0;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 50;
    text-align: center;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes mascotBounceCalm{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-2px); } }
  @keyframes mascotBounceContent{ 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-3px); } }
  @keyframes mascotBounceHappy{ 0%,100%{ transform: translateY(0) rotate(0deg); } 50%{ transform: translateY(-5px) rotate(-2deg); } }
  @keyframes mascotBounceEcstatic{ 0%,100%{ transform: translateY(0) rotate(-2deg); } 50%{ transform: translateY(-8px) rotate(2deg); } }
  @keyframes twinkle{ 0%,100%{ opacity: 0.25; transform: scale(0.7); } 50%{ opacity: 1; transform: scale(1); } }
  .sparkle{ animation: twinkle 1.3s ease-in-out infinite; transform-origin: center; }

  @keyframes prizePop{
    0%{ transform: scale(1) rotate(0deg); }
    30%{ transform: scale(1.35) rotate(-8deg); }
    55%{ transform: scale(1.15) rotate(6deg); }
    75%{ transform: scale(1.25) rotate(-4deg); }
    100%{ transform: scale(1) rotate(0deg); }
  }
  #mascot-slot.prize-pop .mascot-img{ animation: prizePop 0.9s ease; }
  .trophy-badge{
    position:absolute;
    top:-14px;
    right:-10px;
    font-size:26px;
    opacity:0;
    transform: scale(0.4) rotate(-15deg);
    transition: opacity 0.35s ease, transform 0.35s cubic-bezier(.34,1.56,.64,1);
    pointer-events:none;
    filter: drop-shadow(0 3px 4px rgba(74,51,80,0.25));
  }
  .trophy-badge.show{ opacity:1; transform: scale(1) rotate(0deg); }

  @media (max-width: 460px){
    .day-btn{ width: 32px; height: 32px; }
    .day-btn svg{ width: 16px; height: 16px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div id="mascot-slot"></div>
    <div class="header-text">
      <p class="title">Romy's Exercise Quest</p>
    </div>
  </div>

  <div class="progress-card">
    <div class="progress-title">
      <span>Prize progress</span>
      <span class="small" id="progress-sub">0 of 8 weeks toward your next prize</span>
    </div>
    <div class="dots" id="dots"></div>
  </div>

  <div class="weeks" id="weeks"></div>

  <button class="load-more" id="load-more">Show past weeks</button>

</div>

<div class="toast" id="toast"></div>

<div class="surprise-overlay" id="surprise-overlay" aria-hidden="true">
  <div class="surprise-card" id="surprise-card">
    <button class="surprise-close" id="surprise-close" aria-label="Close">&times;</button>
    <div class="gift-stage">
      <p class="surprise-title">8 weeks. You did it!</p>
      <p class="surprise-sub">Romy left you a surprise&hellip;</p>
      <button class="gift-btn" id="gift-btn" aria-label="Open your gift">
        <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
          <rect x="18" y="52" width="84" height="56" rx="8" fill="#FF8FAE" stroke="#E5678F" stroke-width="3"/>
          <rect x="54" y="52" width="12" height="56" fill="#FFC94D"/>
          <g class="gift-lid">
            <rect x="12" y="34" width="96" height="22" rx="8" fill="#FF8FAE" stroke="#E5678F" stroke-width="3"/>
            <rect x="54" y="34" width="12" height="22" fill="#FFC94D"/>
            <path d="M60 34 C40 6 18 20 34 34 Z" fill="#FFC94D" stroke="#E0A415" stroke-width="2.5"/>
            <path d="M60 34 C80 6 102 20 86 34 Z" fill="#FFC94D" stroke="#E0A415" stroke-width="2.5"/>
          </g>
        </svg>
      </button>
      <div class="gift-hint">Tap to open</div>
    </div>
    <div class="prize-reveal">
      <p class="surprise-title">Prize unlocked!</p>
      <img id="surprise-romy" alt="Romy celebrating">
      <p class="prize-note" id="prize-note"></p>
      <button class="surprise-done" id="surprise-done">Yay!</button>
    </div>
  </div>
</div>

<script>
(function(){

  var START_DATE = new Date(2026, 7, 9);
  var WEEKS_PER_PRIZE = 8;
  var GOAL_PER_WEEK = 3;
  var WEEKS_PER_PAGE = 8;
  var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var STORAGE_KEY = 'romy-workout-log';

  var loggedDates = {};
  var pastShown = 0;
  // Edit this to your real prize! It appears when the gift opens.
  var PRIZE_NOTE = 'You showed up for 8 weeks straight. Go treat yourself \u2014 you earned it!';
  var today = new Date();
  today.setHours(0,0,0,0);

  function fmtISO(d){
    var y = d.getFullYear();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return y+'-'+m+'-'+day;
  }
  function fmtShort(d){
    return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
  }
  function addDays(d, n){
    var r = new Date(d);
    r.setDate(r.getDate()+n);
    return r;
  }

  function weekStart(index){ return addDays(START_DATE, index*7); }

  function weekLoggedCount(index){
    var start = weekStart(index);
    var count = 0;
    for(var i=0;i<7;i++){
      var dISO = fmtISO(addDays(start,i));
      if(loggedDates[dISO]) count++;
    }
    return count;
  }

  function totalWeeksAvailable(){
    var diffDays = Math.floor((today - START_DATE) / 86400000);
    var currentWeekIdx = Math.floor(diffDays/7);
    return Math.max(currentWeekIdx+1, 1);
  }

  // First week of the current prize cycle: the week right after the one
  // that completed your most recent set of 8 green weeks.
  function cycleStartIndex(){
    var total = totalWeeksAvailable();
    var count = 0, start = 0;
    for(var i=0;i<total;i++){
      if(weekLoggedCount(i) >= GOAL_PER_WEEK){
        count++;
        if(count % WEEKS_PER_PRIZE === 0) start = i + 1;
      }
    }
    return Math.min(start, total - 1);
  }

  function successfulWeeksCount(){
    var total = totalWeeksAvailable();
    var count = 0;
    for(var i=0;i<total;i++){
      if(weekLoggedCount(i) >= GOAL_PER_WEEK) count++;
    }
    return count;
  }

  var barbellSVG = '<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<rect x="2" y="10" width="2.6" height="4" rx="1" fill="currentColor"/>' +
    '<rect x="0.5" y="9" width="1.8" height="6" rx="0.9" fill="currentColor"/>' +
    '<rect x="19.4" y="10" width="2.6" height="4" rx="1" fill="currentColor"/>' +
    '<rect x="21.7" y="9" width="1.8" height="6" rx="0.9" fill="currentColor"/>' +
    '<rect x="4.6" y="11" width="14.8" height="2" rx="1" fill="currentColor"/>' +
    '<circle cx="6.3" cy="12" r="1" fill="#fff"/>' +
    '<circle cx="17.7" cy="12" r="1" fill="#fff"/>' +
    '</svg>';

  function loadData(){
    fetch('/api/log').then(function(r){ return r.json(); }).then(function(data){
      loggedDates = (data && data.loggedDates) || {};
      render();
    }).catch(function(){
      render();
    });
  }

  function saveData(){
    fetch('/api/log', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ loggedDates: loggedDates })
    }).catch(function(){});
  }

  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(showToast._tm);
    showToast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function burstConfetti(container){
    var colors = ['#FF8FAE','#FFC94D','#6FD9A0','#6FC3E8'];
    for(var i=0;i<18;i++){
      var el = document.createElement('div');
      el.className = 'confetti';
      var left = 10 + Math.random()*80;
      el.style.left = left+'%';
      el.style.background = colors[i % colors.length];
      el.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';
      container.style.position = 'relative';
      container.appendChild(el);
      var dur = 700 + Math.random()*500;
      var xDrift = (Math.random()-0.5)*60;
      el.animate([
        { transform: el.style.transform + ' translate(0,0)', opacity: 1 },
        { transform: 'rotate(' + (Math.random()*720) + 'deg) translate(' + xDrift + 'px, 130px)', opacity: 0 }
      ], { duration: dur, easing: 'ease-out' });
      (function(el){ setTimeout(function(){ el.remove(); }, dur+50); })(el);
    }
  }

  function toggleDay(dateISO, dateObj){
    if(dateObj > today) return;

    var weekIdx = Math.floor((dateObj - START_DATE) / (7 * 86400000));
    var wasDone = weekLoggedCount(weekIdx) >= GOAL_PER_WEEK;

    if(loggedDates[dateISO]){
      delete loggedDates[dateISO];
    } else {
      loggedDates[dateISO] = true;
    }
    saveData();
    render();

    var nowDone = weekLoggedCount(weekIdx) >= GOAL_PER_WEEK;

    if(!wasDone && nowDone){
      var justFinishedCard = document.querySelector('.week-card[data-week-idx="' + weekIdx + '"]');
      if(justFinishedCard){
        justFinishedCard.classList.add('celebrate');
        burstConfetti(justFinishedCard);
      }
      var nowSuccessful = successfulWeeksCount();
      if(nowSuccessful % WEEKS_PER_PRIZE === 0){
        showToast('Prize unlocked! You crushed ' + WEEKS_PER_PRIZE + ' green weeks!');
        celebratePrize();
        setTimeout(showPrizeSurprise, 1300);
      } else {
        showToast('Nice! That week just turned green.');
      }
    }
  }

  function rainConfetti(){
    var colors = ['#FF8FAE','#FFC94D','#6FD9A0','#6FC3E8','#B79CFF'];
    for(var i=0;i<90;i++){
      var el = document.createElement('div');
      el.style.cssText = 'position:fixed;top:-16px;z-index:200;pointer-events:none;border-radius:2px;' +
        'width:' + (6 + Math.random()*7) + 'px;height:' + (8 + Math.random()*8) + 'px;' +
        'background:' + colors[i % colors.length] + ';left:' + (Math.random()*100) + 'vw';
      document.body.appendChild(el);
      var dur = 1800 + Math.random()*1800;
      var drift = (Math.random()-0.5)*160;
      el.animate([
        { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
        { transform: 'translate(' + drift + 'px,' + (window.innerHeight + 40) + 'px) rotate(' + (Math.random()*900) + 'deg)', opacity: 1 }
      ], { duration: dur, delay: Math.random()*600, easing: 'cubic-bezier(.3,.6,.5,1)', fill: 'both' });
      (function(el, t){ setTimeout(function(){ el.remove(); }, t); })(el, dur + 800);
    }
  }

  function showPrizeSurprise(){
    var ov = document.getElementById('surprise-overlay');
    var card = document.getElementById('surprise-card');
    card.className = 'surprise-card';
    document.getElementById('prize-note').textContent = PRIZE_NOTE;
    var mascot = document.querySelector('#mascot-slot .mascot-img');
    var romy = document.getElementById('surprise-romy');
    if(mascot && romy) romy.src = mascot.src;
    ov.className = 'surprise-overlay show';
    ov.setAttribute('aria-hidden', 'false');
  }

  function hidePrizeSurprise(){
    var ov = document.getElementById('surprise-overlay');
    ov.className = 'surprise-overlay';
    ov.setAttribute('aria-hidden', 'true');
  }

  document.getElementById('gift-btn').addEventListener('click', function(){
    var card = document.getElementById('surprise-card');
    if(card.classList.contains('opening')) return;
    card.classList.add('opening');
    setTimeout(function(){
      card.classList.add('opened');
      rainConfetti();
    }, 750);
  });
  document.getElementById('surprise-close').addEventListener('click', hidePrizeSurprise);
  document.getElementById('surprise-done').addEventListener('click', hidePrizeSurprise);

  function celebratePrize(){
    var slot = document.getElementById('mascot-slot');
    if(!slot) return;
    burstConfetti(slot);
    slot.classList.remove('prize-pop');
    void slot.offsetWidth;
    slot.classList.add('prize-pop');
    var badge = document.getElementById('trophy-badge');
    if(badge){
      badge.classList.add('show');
      clearTimeout(celebratePrize._tm);
      celebratePrize._tm = setTimeout(function(){ badge.classList.remove('show'); }, 2600);
    }
  }

  function renderMascot(successCount){
    var cyclePos = successCount % WEEKS_PER_PRIZE;
    var mood = cyclePos === 0 && successCount > 0 ? 'ecstatic' : (cyclePos >= 5 ? 'happy' : (cyclePos >= 2 ? 'content' : 'calm'));
    var slot = document.getElementById('mascot-slot');
    slot.className = 'mood-' + mood;
    slot.innerHTML =
      '<div class="trophy-badge" id="trophy-badge" aria-hidden="true">&#127942;</div>' +
      '<img class="mascot-img" alt="Green-eyed tabby fitness mascot" src="/romy-mascot.jpg">' +
      '<div class="mascot-burst" aria-hidden="true"><span>✦</span><span>★</span><span>✦</span><span>★</span></div>';
  }

  function render(){
    var total = totalWeeksAvailable();
    var cycleStart = cycleStartIndex();
    var successCount = successfulWeeksCount();
    var cyclePos = successCount % WEEKS_PER_PRIZE;

    document.getElementById('progress-sub').textContent = cyclePos + ' of ' + WEEKS_PER_PRIZE + ' weeks toward your next prize';

    var dotsEl = document.getElementById('dots');
    dotsEl.innerHTML = '';
    for(var d=0; d<WEEKS_PER_PRIZE; d++){
      var dot = document.createElement('div');
      dot.className = 'dot' + (d < cyclePos ? ' filled' : '');
      dot.textContent = d + 1;
      dotsEl.appendChild(dot);
    }

    renderMascot(successCount);

    var weeksEl = document.getElementById('weeks');
    weeksEl.innerHTML = '';

    var order = [];
    for(var cw = total - 1; cw >= cycleStart; cw--) order.push(cw);
    var pastEnd = Math.max(0, cycleStart - pastShown);
    for(var pw = cycleStart - 1; pw >= pastEnd; pw--) order.push(pw);

    for(var oi = 0; oi < order.length; oi++){
      var w = order[oi];
      if(w === cycleStart - 1){
        var lbl = document.createElement('div');
        lbl.className = 'past-label';
        lbl.textContent = 'Past weeks';
        weeksEl.appendChild(lbl);
      }
      var start = weekStart(w);
      var end = addDays(start, 6);
      var count = weekLoggedCount(w);
      var done = count >= GOAL_PER_WEEK;

      var card = document.createElement('div');
      card.className = 'week-card' + (done ? ' done' : '');
      card.setAttribute('data-week-idx', w);

      var top = document.createElement('div');
      top.className = 'week-top';
      var label = document.createElement('div');
      label.className = 'week-label';
      label.textContent = fmtShort(start) + ' \u2013 ' + fmtShort(end);
      var badge = document.createElement('div');
      badge.className = 'week-badge';
      badge.textContent = done ? 'Goal hit!' : (count + '/' + GOAL_PER_WEEK + ' workouts');
      top.appendChild(label);
      top.appendChild(badge);
      card.appendChild(top);

      var daysEl = document.createElement('div');
      daysEl.className = 'days';

      (function(start, card){
        for(var i=0;i<7;i++){
          var dObj = addDays(start, i);
          var dISO = fmtISO(dObj);
          var isFuture = dObj > today;

          var dayWrap = document.createElement('div');
          dayWrap.className = 'day';

          var dn = document.createElement('div');
          dn.className = 'day-name';
          dn.textContent = DAY_NAMES[i];

          var btn = document.createElement('button');
          btn.className = 'day-btn' + (loggedDates[dISO] ? ' logged' : '') + (isFuture ? ' future' : '');
          btn.innerHTML = barbellSVG;
          btn.setAttribute('aria-label', 'Log workout for ' + fmtShort(dObj));
          if(!isFuture){
            btn.addEventListener('click', (function(dISO, dObj){
              return function(){ toggleDay(dISO, dObj); };
            })(dISO, dObj));
          }

          var num = document.createElement('div');
          num.className = 'day-num';
          num.textContent = dObj.getDate();

          dayWrap.appendChild(dn);
          dayWrap.appendChild(btn);
          dayWrap.appendChild(num);
          daysEl.appendChild(dayWrap);
        }
      })(start, card);

      card.appendChild(daysEl);
      weeksEl.appendChild(card);
    }

    document.getElementById('load-more').style.display = (pastEnd > 0) ? 'block' : 'none';
  }

  document.getElementById('load-more').addEventListener('click', function(){
    pastShown += WEEKS_PER_PAGE;
    render();
  });

  loadData();

  // Preview the surprise any time by adding ?surprise to the page address
  if(window.location.search.indexOf('surprise') !== -1){
    setTimeout(showPrizeSurprise, 800);
  }

})();
</script>
</body>
</html>
